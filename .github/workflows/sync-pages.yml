name: Deploy KAMIMICHI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kamimichi-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/images
          cp index.html app.css app-*.js _site/
          cp images/kamimichi-sheet-1.jpg _site/images/
          cp images/kamimichi-sheet-2.jpg _site/images/
          touch _site/.nojekyll
          test -s _site/images/kamimichi-sheet-1.jpg
          test -s _site/images/kamimichi-sheet-2.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
