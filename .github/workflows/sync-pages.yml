name: Import working KAMIMICHI and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kamimichi-pages
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import the working public build
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://radiant-haven-4345.hosted.pageshare.ai'
          curl -fL --retry 3 "$BASE/" -o index.html
          for f in app.css app-01.js app-02.js app-03.js app-04.js app-05.js app-06.js app-07.js app-08.js; do
            curl -fL --retry 3 "$BASE/$f" -o "$f"
          done
          touch .nojekyll

      - name: Keep imported source in the repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.css app-*.js .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Import working KAMIMICHI build'
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
